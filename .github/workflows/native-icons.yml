name: Generate native launcher icons
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_native_icons.py'
      - 'public/flashfood-logo.png'
      - '.github/workflows/native-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Generate icons
        run: python scripts/generate_native_icons.py
      - name: Commit generated iOS and Android icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/App/App/Assets.xcassets/AppIcon.appiconset android/app/src/main/res/mipmap-* android/app/src/main/res/values/ic_launcher_background.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore(native): regenerate launcher icons from FlashFood logo [skip ci]"
            git push origin HEAD:main
          fi
